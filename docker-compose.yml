services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edutech
      POSTGRES_PASSWORD: edutech
      POSTGRES_DB: edutech
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - edutech-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  edutech-pg:
